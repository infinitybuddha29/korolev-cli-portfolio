<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frontend engineer with 8+ years in product teams. I build web products end-to-end — from landing pages to full apps with auth, payments and AI."
    />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ruslan Korolev — Senior Frontend Engineer" />
    <meta
      property="og:description"
      content="I build web products end-to-end — from landing pages to full apps with auth, payments and AI."
    />
    <!-- absolute: several scrapers (LinkedIn among them) skip relative og:image -->
    <meta property="og:image" content="https://korolevdev.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://korolevdev.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Ruslan Korolev — Senior Frontend Engineer</title>
    <link rel="canonical" href="https://korolevdev.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        // any unknown value would match neither token block and leave the page
        // with no colours at all, so fall back rather than trust storage
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
