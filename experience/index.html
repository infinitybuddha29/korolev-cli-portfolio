    <!-- absolute: several scrapers (LinkedIn among them) skip relative og:image -->

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <title>Ruslan Korolev — Experience</title>
    <link rel="canonical" href="https://korolevdev.com/experience/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        // any unknown value would match neither token block and leave the page
        // with no colours at all, so fall back rather than trust storage
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ruslan Korolev",
        "jobTitle": "Senior Frontend Engineer",
        "email": "ruslan.korolev29@gmail.com",
        "sameAs": [
          "https://github.com/infinitybuddha29",
          "https://linkedin.com/in/ruslan-korolev-frontend"
        ]
      }
    </script>
  </head>
  <body>

    <script type="module" src="/src/experience.tsx"></script>
  </body>
</html>
